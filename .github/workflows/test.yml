name: Java practice course
on: [push, pull_request]
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: make reference
      - name: Unfinished starter must fail a focused test
        run: |
          if make check TASK=move-zeros; then
            echo "Unexpected successful starter"
            exit 1
          fi
